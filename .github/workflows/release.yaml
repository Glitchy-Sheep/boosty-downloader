name: Release

on:
  push:
    tags: ['v*']

env:
  PACKAGE_NAME: boosty-downloader

jobs:
  validate:
    name: 🔍 Validate Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: $VERSION"

      - name: Verify tag matches pyproject.toml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TOML_VERSION=$(python -c "
          import tomllib, pathlib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          print(data['project']['version'])
          ")
          if [ "$VERSION" != "$TOML_VERSION" ]; then
            echo "❌ Tag v$VERSION does not match pyproject.toml version $TOML_VERSION"
            exit 1
          fi
          echo "✅ Tag matches pyproject.toml version"

      - name: Validate CHANGELOG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md not found"
            exit 1
          fi
          if ! grep -q "^## $VERSION" CHANGELOG.md; then
            echo "❌ Version $VERSION not found in CHANGELOG.md"
            exit 1
          fi
          echo "✅ CHANGELOG.md contains version $VERSION"

      - name: Check PyPI availability
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE_NAME/$VERSION/json")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "❌ Version $VERSION already exists on PyPI"
            exit 1
          fi
          echo "✅ Version $VERSION is available for release"

  build:
    name: 🔨 Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Build
        run: task build
        timeout-minutes: 10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    name: 🚀 Release
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify tag
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          echo "📦 Releasing version: $VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # Notes travel through a file: inlined into the script, any quote
      # character in the changelog breaks the shell (it did on v3.1.0).
      - name: Extract changelog for version
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          sed -n "/^## $VERSION/,/^## /{/^## $VERSION/d;/^## /d;p}" CHANGELOG.md > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          gh release create "v$VERSION" dist/* \
            --title "v$VERSION" \
            --notes-file release-notes.md
