name: Diagnose Media transition image delivery

on:
  push:
    branches: [test/diagnose-media-transition]

permissions:
  contents: read

jobs:
  image-delivery:
    if: github.ref == 'refs/heads/test/diagnose-media-transition'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: viewer-ui
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Task, uv, Python and the dependencies
        uses: ./.github/actions/setup
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: viewer-ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Validate the diagnostic harness without browsers
        run: |
          npx tsc -p diagnostics/media-image-delivery/tsconfig.json
          npx oxlint --deny-warnings diagnostics/media-image-delivery
          npx oxfmt --check diagnostics/media-image-delivery
          node --test diagnostics/media-image-delivery/protocol.test.mjs
      - name: Build unchanged viewer assets
        run: npm run build
      - name: Cache Playwright Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('viewer-ui/package-lock.json') }}
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Configure virtual audio output
        run: |
          sudo apt-get install --yes pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=viewer_ci
          pactl set-default-sink viewer_ci
          test "$(pactl get-default-sink)" = viewer_ci
      - name: Cell 1 - normal image delivery
        continue-on-error: true
        env:
          BOOSTY_MEDIA_CELL: 01-normal
        run: |
          node diagnostics/media-image-delivery/protocol.mjs verify
          npx playwright test -c diagnostics/media-image-delivery/playwright.config.ts
      - name: Cell 2 - hold five original images
        continue-on-error: true
        env:
          BOOSTY_MEDIA_CELL: 02-held
        run: |
          node diagnostics/media-image-delivery/protocol.mjs verify
          npx playwright test -c diagnostics/media-image-delivery/playwright.config.ts
      - name: Cell 3 - hold five original images
        continue-on-error: true
        env:
          BOOSTY_MEDIA_CELL: 03-held
        run: |
          node diagnostics/media-image-delivery/protocol.mjs verify
          npx playwright test -c diagnostics/media-image-delivery/playwright.config.ts
      - name: Cell 4 - normal image delivery
        continue-on-error: true
        env:
          BOOSTY_MEDIA_CELL: 04-normal
        run: |
          node diagnostics/media-image-delivery/protocol.mjs verify
          npx playwright test -c diagnostics/media-image-delivery/playwright.config.ts
      - name: Summarize every cell and retain failed assertions
        if: always()
        run: node diagnostics/media-image-delivery/protocol.mjs summarize
      - name: Upload all diagnostic outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-image-delivery-diagnostic
          path: viewer-ui/test-results/media-image-delivery/
          retention-days: 7
          if-no-files-found: warn
