name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels its previous run; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: 🩺 Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Ruff check
        run: task check:lint
      - name: Ruff format
        run: task check:format
      - name: Pyright
        run: task check:types

  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup
      # Integration tests need Boosty API credentials stored in ./.env
      # (repo root - that's where pydantic-settings loads it from).
      # The file is gitignored, so CI and fork PRs run unit tests only.
      # Coverage is reported, not enforced: watch the number in the log
      # (78% on 2026-08-17).
      - name: Run tests
        run: |
          task test:cov -- -v
          if [ -f .env ]; then
            task test:api -- -v
          else
            echo "⏭️ Skipping integration tests (no .env config available)"
          fi
        timeout-minutes: 5

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup
      - name: Build & verify
        run: |
          task build
          ls dist/*.whl dist/*.tar.gz || { echo "❌ Build artifacts missing"; exit 1; }
          echo "✅ Build artifacts created successfully"
      # The renderer loads its Jinja templates from the installed package:
      # a wheel without them builds fine and crashes at render time.
      - name: Verify templates are inside the wheel
        run: |
          TEMPLATES=$(unzip -l dist/*.whl | grep -c 'html_generator/templates/.*\.html' || true)
          echo "Templates found in wheel: $TEMPLATES"
          [ "$TEMPLATES" -ge 7 ] || { echo "❌ Jinja templates missing from the wheel"; exit 1; }

  changelog:
    name: 📝 Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history is needed to diff the Unreleased section
      # against the merge base between the PR branch and main.
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Enforce that every PR adds new entries to the "## Unreleased" section
      # in CHANGELOG.md. Simply touching the file is not enough - the check
      # verifies that the Unreleased section gained new lines compared to the
      # base branch. Removing the heading or deleting entries won't pass.
      #
      # For non-user-facing PRs (CI fixes, refactoring, docs) this can be skipped:
      #   - Put [skip changelog] anywhere in the PR title, OR
      #   - Add the "ci/skip-changelog" label to the PR
      - name: Check CHANGELOG.md updated
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo "$PR_TITLE" | grep -qi "\[skip changelog\]"; then
            echo "⏭️ Skipping changelog check (title marker)"
            exit 0
          fi

          if echo "$PR_LABELS" | grep -qi "ci/skip-changelog"; then
            echo "⏭️ Skipping changelog check (label)"
            exit 0
          fi

          BASE_REF="origin/${{ github.base_ref }}"

          # 1. Verify that ## Unreleased heading still exists
          if ! grep -q "^## Unreleased" CHANGELOG.md; then
            echo "::error::Unreleased section is missing from CHANGELOG.md"
            echo ""
            echo "❌ '## Unreleased' heading was removed or renamed."
            echo "Every PR must keep this heading intact and add entries under it."
            echo "Use [skip changelog] in PR title or ci/skip-changelog label to skip."
            exit 1
          fi

          # 2. Extract the Unreleased section content from base and HEAD
          BASE_SECTION=$(git show "$BASE_REF:CHANGELOG.md" \
            | sed -n '/^## Unreleased$/,/^## [0-9]/{/^##/d;p}' 2>/dev/null || echo "")
          HEAD_SECTION=$(sed -n '/^## Unreleased$/,/^## [0-9]/{/^##/d;p}' CHANGELOG.md)

          # 3. Find lines added to the Unreleased section
          ADDED=$(diff <(echo "$BASE_SECTION") <(echo "$HEAD_SECTION") \
            | grep "^> " | sed 's/^> //' | grep -v "^$" || true)

          if [ -z "$ADDED" ]; then
            echo "::error::No new entries in the Unreleased section of CHANGELOG.md"
            echo ""
            echo "❌ No new entries added to '## Unreleased' section."
            echo ""
            echo "Add a line describing your changes, for example:"
            echo "  - Fix the frobnicator timeout when server is slow"
            echo ""
            echo "Use [skip changelog] in PR title or ci/skip-changelog label to skip."
            exit 1
          fi

          echo "✅ CHANGELOG updated - new entries in Unreleased:"
          echo ""
          echo "$ADDED" | while IFS= read -r line; do
            echo "    $line"
          done

          # Show new entries in the GitHub Actions job summary
          {
            echo "### Changelog"
            echo ""
            echo "$ADDED"
          } >> "$GITHUB_STEP_SUMMARY"
