name: Weekly report

# Sends a summary of the past week to Telegram: canary and CI state, pull
# requests, issues, releases, PyPI downloads and stars.
# Needs two repository secrets: TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID.
on:
  schedule:
    - cron: '0 9 * * 6'  # Saturdays, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  report:
    name: 📊 Weekly report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the Telegram secrets are set
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::Set the TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID repository secrets"
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build the report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/weekly_report.py > report.html
      - name: Send to Telegram
        uses: appleboy/telegram-action@v1.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_file: report.html
          format: html
          disable_web_page_preview: true
