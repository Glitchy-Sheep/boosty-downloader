name: Setup Python & uv
description: Task, uv with a managed Python and cached dependencies

runs:
  using: composite
  steps:
    - name: Install Task
      uses: go-task/setup-task@v2

    # uv installs the Python from .python-version itself and caches its
    # package cache keyed by uv.lock - no separate setup-python/cache steps.
    # Exact tag: setup-uv publishes no floating major tags (v9 does not resolve).
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync
      shell: bash
