<div class="unavailable">
    <span class="unavailable-icon">⚠️</span>
    <span class="unavailable-text">
        <span class="unavailable-title">{{ title }}</span>
{% if item.reason %}
        <span class="unavailable-reason">{{ item.reason }}</span>
{% else %}
        <span class="unavailable-reason" data-page-generated="true">No reason recorded.</span>
{% endif %}
{% if duration is not none %}
        <span class="unavailable-reason" data-page-generated="true">Duration: {{ duration }}</span>
{% endif %}
{% if item.source_url %}
        <a class="unavailable-link" href="{{ item.source_url }}">Open the original</a>
{% endif %}
    </span>
</div>
