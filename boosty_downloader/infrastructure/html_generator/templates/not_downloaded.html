<div class="unavailable">
    <span class="unavailable-icon" aria-hidden="true">⚠️</span>
    <span class="unavailable-text">
        <span class="unavailable-title"><span data-page-generated="true">{{ kind }} not downloaded{% if item.label %}: {% endif %}</span>{{ item.label }}</span>
{% if duration is not none %}
        <span class="unavailable-reason" data-page-generated="true">Duration: {{ duration }}</span>
{% endif %}
{% set href = safe_href(item.post_url) %}
{% if href %}
        <a class="unavailable-link" href="{{ href }}" data-page-generated="true">Open the post on Boosty</a>
{% else %}
        <span class="unavailable-reason" data-page-generated="true">Open the post on Boosty</span>
{% endif %}
    </span>
</div>
