openapi: 3.1.0
info:
  title: Boosty API as seen by boosty-downloader
  version: '2026-10-03'
  description: 'Observed, not official: built from live answers by `task api:schema`. Only shapes and
    counts are recorded.'
x-observed:
  captured_at: '2026-09-24'
  samples:
    blogs: 1
    pages: 2
    posts: 24
    views: 2
  blog_info:
    captured_at: '2026-10-03'
    samples:
      blogs: 2
      views: 2
      responses: 4
paths:
  /blog/{blog}:
    get:
      summary: Blog metadata and owner details
      parameters:
      - name: blog
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogInfo'
        '400':
          description: Malformed blog name
        '401':
          description: Credentials rejected
        '404':
          description: No such blog
  /blog/{blog}/post/:
    get:
      summary: A page of the blog posts, newest first
      parameters:
      - &id001
        name: blog
        in: path
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          maximum: 100
      - name: offset
        in: query
        description: The `extra.offset` of the previous page
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsPage'
        '400':
          description: Malformed blog name
        '401':
          description: Credentials rejected
        '404':
          description: No such blog
  /blog/{blog}/post/{id}:
    get:
      summary: One post with fresh signed links
      parameters:
      - *id001
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Credentials rejected
        '404':
          description: No such post
