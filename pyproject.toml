[project]
name = "boosty-downloader"
version = "3.6.0"
description = "Download any type of content from boosty.to"
authors = [{ name = "Roman Berezkin", email = "Glitchy-Sheep@users.noreply.github.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiofiles (>=24.1.0,<25.0.0)",
    "aiohttp (>=3.11.12,<4.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "pydantic-settings[yaml] (>=2.7.1,<3.0.0)",
    "typer (>=0.27.1,<0.28.0)",
    "yt-dlp (>=2026.7.4,<2026.8.0)",
    "jinja2 (>=3.1.5,<4.0.0)",
    "aiohttp-retry (>=2.9.1,<3.0.0)",
    "yarl (>=1.18.3,<2.0.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "aiolimiter (>=1.2.1,<2.0.0)",
    "packaging (>=25.0,<26.0)",
    "pyperclip (>=1.9.0,<2.0.0)",
    "pyyaml (>=6.0,<7.0)",
]

[project.urls]
Homepage = "https://github.com/Glitchy-Sheep/boosty-downloader"
Issues = "https://github.com/Glitchy-Sheep/boosty-downloader/issues"
Changelog = "https://github.com/Glitchy-Sheep/boosty-downloader/blob/main/CHANGELOG.md"

[project.scripts]
boosty-downloader = "boosty_downloader.main:entry_point"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boosty_downloader"]

# Explicit allowlist: by default hatchling packs every non-vcs-ignored file
# into the sdist, including untracked local notes. Only the package ships;
# pyproject.toml, README and LICENSE are added automatically.
[tool.hatch.build.targets.sdist]
only-include = ["boosty_downloader"]

[dependency-groups]
dev = [
    "ruff>=0.16.2,<0.17.0",
    "pyright>=1.1.394,<2",
    "pytest>=9.0.0,<10",
    "pytest-asyncio>=1.1.0,<2",
    "pytest-cov>=7.0.0,<8",
]

[tool.uv]
default-groups = "all"

[tool.pytest.ini_options]
# auto mode: every async test runs under asyncio without a manual mark.
asyncio_mode = "auto"
# Bare `pytest` runs unit and e2e (local server) tests: integration ones
# need live credentials. An explicit path argument (task test:api) overrides this.
testpaths = ["test/unit", "test/e2e"]
# -ra: show the reason for every skip/xfail in the summary.
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["boosty_downloader"]

[tool.coverage.report]
show_missing = true
skip_covered = true
