[project]
name = "boosty-downloader"
version = "3.0.0"
description = "Download any type of content from boosty.to"
authors = [
    { name = "Roman Berezkin", email = "Glitchy-Sheep@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "aiofiles (>=24.1.0,<25.0.0)",
    "aiohttp (>=3.11.12,<4.0.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "rich (>=14.0.0,<15.0.0)",
    "pydantic-settings[yaml] (>=2.7.1,<3.0.0)",
    "typer (>=0.27.1,<0.28.0)",
    "yt-dlp (>=2026.7.4,<2026.8.0)",
    "jinja2 (>=3.1.5,<4.0.0)",
    "aiohttp-retry (>=2.9.1,<3.0.0)",
    "yarl (>=1.18.3,<2.0.0)",
    "sqlalchemy (>=2.0.42,<3.0.0)",
    "aiolimiter (>=1.2.1,<2.0.0)",
    "packaging (>=25.0,<26.0)",
    "pyperclip (>=1.9.0,<2.0.0)",
]

[project.scripts]
boosty-downloader = "boosty_downloader.main:entry_point"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.1,<0.17.0"
pyright = "^1.1.394"
pytest = "^9.0.0"
pytest-asyncio = "^1.1.0"


[tool.poetry]
name = "boosty-downloader"
description = "Download any type of content from boosty.to"
authors = ["Roman Berezkin"]
readme = "README.md"

packages = [{ include = "boosty_downloader" }]
