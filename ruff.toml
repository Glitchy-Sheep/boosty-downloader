# match black

line-length = 88
lint.select = [
    "ALL", # include all the rules, including new ones
]
lint.ignore = [
    "E501",   # line too long    
    "D102",   # missing docstring in public method
    "D212",   # multiline docstring should start at the first line (personal preference)
    "D107",   # missing docstring in __init__ (lol why)
    "D400",   # first line should end with a period (sometimes mess with markdown or code blocks)
    "D415",   # first line should end with a period (same as above but trickier)
    "RUF001", # unused variable
    "G004",   # don't log f-strings (personal preference)
    "D203",   # incorrected blank line before class is incompatible with D211
    "COM812", # missing trailing comma (formatter conflicts with this)
]

[lint.per-file-ignores]
# D: no docstrings needed in tests
# ANN201: test functions always return None, no need to annotate
# S101: pytest is built on assert
# PLR2004: magic numbers are fine in test assertions
# INP001: test dir is not a package, no __init__.py needed
"test/*" = ["D", "ANN201", "S101", "PLR2004", "INP001"]
# T201: dev scripts may use print()
# INP001: scripts dir is not a package
# S603: subprocess with fixed args in trusted dev scripts
# S607: partial executable path (poetry, pip) is fine for dev scripts
"scripts/*" = ["T201", "INP001", "S603", "S607"]
# D104: __init__.py files are often empty or re-exports only
"__init__.py" = ["D104"]

[format]
quote-style = "single"

[lint.flake8-quotes]
inline-quotes = "single"
